version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: snaproom-db
    environment:
      POSTGRES_USER: snaproom
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: snaproom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build: ./ai-service
    container_name: snaproom-ai
    ports:
      - "8001:8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  spring-backend:
    build: ./backend
    container_name: snaproom-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/snaproom
      SPRING_DATASOURCE_USERNAME: snaproom
      SPRING_DATASOURCE_PASSWORD: secretpassword
      STORAGE_BUCKET_NAME: snaproom-photos
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    depends_on:
      - postgres
      - ai-service

volumes:
  pgdata:
