server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: SnapRoom
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/photo_sharing_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:MyNewPassword123}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:snaproom-super-secret-key-that-is-at-least-256-bits-long-for-jwt-signing-2026!}
  expiration-ms: 604800000

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}

storage:
  endpoint: ${STORAGE_ENDPOINT:${R2_ENDPOINT:https://dummy.r2.cloudflarestorage.com}}
  account-id: ${R2_ACCOUNT_ID:}
  region: ${STORAGE_REGION:${R2_REGION:auto}}
  bucket-name: ${STORAGE_BUCKET_NAME:${R2_BUCKET_NAME:snaproom-photos}}
  access-key-id: ${R2_ACCESS_KEY_ID:${AWS_ACCESS_KEY_ID:test}}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:${AWS_SECRET_ACCESS_KEY:test}}
  public-url: ${R2_PUBLIC_URL:}

room:
  ttl-days: ${ROOM_TTL_DAYS:2}
  cleanup:
    fixed-rate-ms: ${ROOM_CLEANUP_RATE_MS:1800000}
    initial-delay-ms: ${ROOM_CLEANUP_INITIAL_DELAY_MS:60000}
